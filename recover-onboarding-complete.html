<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're set up - SWEEP Recover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
:root {
  --white: #ffffff;
  --bg: #f7f7fb;
  --ink: #12121a;
  --ink-soft: #55556b;
  --ink-mid: #8a8aa0;
  --rule: #ebebf3;
  --violet: #7c5cfc;
  --violet-bg: #f1eeff;
  --coral: #e96a4d;
  --coral-h: #d95a3d;
  --green: #1db27a;
  --green-bg: #e8f8f1;
  --red: #eb5757;
  --black: #12121a;
  --r: 16px;
  --shadow-md: 0 12px 32px rgba(18,18,26,0.10);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.nav {
  max-width: 760px;
  margin: 24px auto 0;
  padding: 10px 18px;
  background: var(--white);
  border: 1px solid var(--rule);
  border-radius: 999px;
  box-shadow: var(--shadow-md);
}
.logo { font-weight: 800; font-size: 1.15rem; text-decoration: none; color: var(--ink); }
.logo span { color: var(--coral); }

.wrap { max-width: 560px; margin: 0 auto; padding: 44px 20px 80px; text-align: center; }
.card {
  background: var(--white);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  padding: 40px 30px;
  box-shadow: var(--shadow-md);
  margin-top: 28px;
}
.badge {
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--violet-bg); color: var(--violet);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; margin: 0 auto 18px;
}
h1 { font-size: 1.7rem; font-weight: 800; margin: 0 0 10px; letter-spacing: -0.02em; }
p { color: var(--ink-soft); line-height: 1.6; }

.upload-box {
  text-align: left;
  margin-top: 26px;
  padding-top: 24px;
  border-top: 1px solid var(--rule);
}
.upload-box label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; }
.upload-box input[type="file"] {
  width: 100%;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.9rem;
  background: var(--bg);
}
.consent-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 16px;
  font-size: 0.85rem;
  color: var(--ink-soft);
  line-height: 1.5;
}
.consent-row input[type="checkbox"] { width: auto; margin-top: 3px; flex-shrink: 0; }
button {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  border: none;
  border-radius: 999px;
  background: var(--coral);
  color: var(--white);
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
}
button:hover { background: var(--coral-h); }
button:disabled { opacity: 0.6; cursor: not-allowed; }

#result { display: none; margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.9rem; text-align: left; line-height: 1.5; }
#result.success { background: var(--green-bg); color: #0f7a51; display: block; }
#result.error { background: #fdecea; color: #b03a2e; display: block; }

.fallback { margin-top: 18px; font-size: 0.85rem; color: var(--ink-mid); text-align: center; }
a.mail { color: var(--coral); font-weight: 600; text-decoration: none; }
.ref { margin-top: 20px; font-size: 0.8rem; color: #b0b0c4; }
</style>
</head>
<body>
<div class="nav">
  <a href="/" class="logo">SweepDBM<span>.</span></a>
</div>

<div class="wrap">
  <div class="card">
    <div class="badge">&#10003;</div>
    <h1>You're all set</h1>
    <p>Payment's through. Your dedicated number and account are being created automatically right now - that takes about a minute.</p>

    <div class="upload-box">
      <label for="csv-file">Upload your dormant/old leads (CSV or Excel - name + phone number is enough, any format works)</label>
      <input type="file" id="csv-file" accept=".csv,.xlsx,.xls">
      <label class="consent-row" for="consent-checkbox">
        <input type="checkbox" id="consent-checkbox">
        <span>I confirm this business has permission to contact everyone in this list by SMS.</span>
      </label>
      <button type="button" id="upload-btn">Upload my leads</button>
      <div id="result"></div>
    </div>

    <p class="fallback">Having trouble? Email your list to <a class="mail" href="mailto:david@silverbulletpro.com?subject=My%20lead%20list%20-%20Recover">david@silverbulletpro.com</a> instead.</p>
    <p id="ref" class="ref"></p>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const businessId = params.get('business_id');
  if (businessId) {
    document.getElementById('ref').textContent = 'Reference: ' + businessId;
  }

  const fileInput = document.getElementById('csv-file');
  const consentCheckbox = document.getElementById('consent-checkbox');
  const uploadBtn = document.getElementById('upload-btn');
  const resultBox = document.getElementById('result');

  uploadBtn.addEventListener('click', async () => {
    resultBox.className = '';
    resultBox.style.display = 'none';

    if (!businessId) {
      resultBox.className = 'error';
      resultBox.textContent = "We couldn't find your account reference in the page link - please email your list instead.";
      return;
    }
    if (!fileInput.files.length) {
      resultBox.className = 'error';
      resultBox.textContent = 'Choose a CSV or Excel file first.';
      return;
    }
    if (!consentCheckbox.checked) {
      resultBox.className = 'error';
      resultBox.textContent = 'Please confirm you have permission to contact this list before uploading.';
      return;
    }

    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Uploading...';

    const formData = new FormData();
    formData.append('business_id', businessId);
    formData.append('file', fileInput.files[0]);
    formData.append('permission_confirmed', 'true');

    try {
      const res = await fetch('https://silver-bullet-ai-production.up.railway.app/api/campaigns/upload-leads', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Something went wrong uploading that file.');
      }

      resultBox.className = 'success';
      resultBox.textContent = `Got it - ${data.valid_count} leads queued` +
        (data.skipped_count ? ` (${data.skipped_count} rows skipped - invalid numbers, duplicates, or opt-outs)` : '') +
        `. We'll start reaching out to them shortly, and hot replies will hit your phone the moment someone responds.`;
      uploadBtn.textContent = 'Uploaded';

    } catch (err) {
      resultBox.className = 'error';
      resultBox.textContent = err.message.includes('not active yet') || err.message.includes('provisioned')
        ? "Your account is still finishing setup (usually under a minute after payment) - please try uploading again shortly."
        : err.message;
      uploadBtn.disabled = false;
      uploadBtn.textContent = 'Upload my leads';
    }
  });
</script>
</body>
</html>
