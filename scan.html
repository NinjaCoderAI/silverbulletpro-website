<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldmine Assessment | SWEEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --purple: #6C4CF1;
    --purple-50: #F4F1FE;
    --purple-100: #EAE4FD;
    --ink: #14121F;
    --ink-soft: #5B5868;
    --ink-faint: #918FA0;
    --border: #ECEAF3;
    --font-display: 'Inter', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FAFAFB;
    color: var(--ink);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }
  .font-display { font-family: var(--font-display); }
  .font-mono { font-family: var(--font-mono); }
  .text-purple { color: var(--purple); }
  .text-ink { color: var(--ink); }
  .text-ink-soft { color: var(--ink-soft); }
  .text-ink-faint { color: var(--ink-faint); }
  .bg-purple { background: var(--purple); }
  .bg-purple-50 { background: var(--purple-50); }
  .bg-purple-100 { background: var(--purple-100); }
  .border-c { border-color: var(--border); }

  .fade-up { animation: fadeUp 0.8s var(--ease-out) forwards; opacity: 0; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--purple); font-family: var(--font-mono); margin-bottom: 0.75rem;
  }
  .eyebrow .rule { width: 18px; height: 1px; background: var(--purple); display: inline-block; }

  .primary-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--purple); color: #fff;
    font-weight: 600; font-size: 0.92rem;
    padding: 13px 24px; border-radius: 999px; border: none; cursor: pointer;
    box-shadow: 0 10px 30px -10px rgba(108,76,241,0.5);
    transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out), background 0.2s var(--ease-out);
  }
  .primary-btn:hover { transform: translateY(-1px); background: #5B3DE0; box-shadow: 0 14px 34px -8px rgba(108,76,241,0.6); }
  .primary-btn:active { transform: translateY(0) scale(0.97); }
  .primary-btn svg { transition: transform 0.2s var(--ease-out); }
  .primary-btn:hover svg { transform: translateX(2px); }

  .secondary-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #fff; color: var(--ink);
    font-weight: 500; font-size: 0.92rem;
    padding: 13px 22px; border-radius: 999px; border: 1px solid var(--border); cursor: pointer;
    transition: border-color 0.2s var(--ease-out), color 0.2s var(--ease-out);
  }
  .secondary-btn:hover { border-color: var(--purple); color: var(--purple); }
  .secondary-btn:active { transform: scale(0.97); }

  .glass-card {
    background: rgba(255,255,255,0.85);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 20px 60px -35px rgba(108,76,241,0.3);
  }

  .quiz-card {
    margin-top: 28px; background: #fff; border: 1px solid var(--border);
    border-radius: 24px; padding: 36px 32px;
    box-shadow: 0 25px 70px -40px rgba(108,76,241,0.35);
  }

  .choice-btn {
    display: flex; align-items: center; justify-content: space-between;
    text-align: left; padding: 14px 18px; border-radius: 14px; border: 1.5px solid var(--border);
    font-size: 0.92rem; color: var(--ink); cursor: pointer; background: #fff;
    transition: border-color 0.18s var(--ease-out), background 0.18s var(--ease-out), transform 0.15s var(--ease-out);
  }
  .choice-btn:hover { transform: translateY(-1px); border-color: var(--purple); }
  .choice-btn.selected { border-color: var(--purple); background: var(--purple-50); }

  .numeric-input-wrap {
    display: flex; align-items: center; gap: 8px;
    border: 1.5px solid var(--border); border-radius: 14px; padding: 14px 18px;
    transition: border-color 0.18s var(--ease-out);
  }
  .numeric-input-wrap:focus-within { border-color: var(--purple); }
  .numeric-input { border: none; outline: none; font-size: 1rem; width: 100%; font-family: var(--font-mono); color: var(--ink); background: transparent; }

  .reaction-bubble {
    background: var(--purple-50); border-radius: 14px; padding: 10px 16px;
    font-size: 0.88rem; color: var(--ink-soft); min-height: 20px; display: flex; align-items: center;
  }
  .typing-dots { display: inline-flex; gap: 4px; }
  .typing-dots span { width: 5px; height: 5px; border-radius: 999px; background: var(--purple); animation: bounceDot 1.1s ease-in-out infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounceDot { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

  .pulse-ring { position: absolute; inset: 0; border-radius: 999px; border: 2px solid rgba(108,76,241,0.45); animation: ringPulse 2.2s ease-out infinite; }
  .pulse-ring-delay { animation-delay: 1.1s; }
  @keyframes ringPulse { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(1.7); opacity: 0; } }

  .upload-zone { border: 1.5px dashed var(--border); border-radius: 18px; padding: 34px 20px; text-align: center; cursor: pointer; transition: border-color 0.2s var(--ease-out), background 0.2s var(--ease-out); background: #fff; }
  .upload-zone.drag { border-color: var(--purple); background: var(--purple-50); }

  .insight-row { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: #fff; font-size: 0.9rem; color: var(--ink-soft); }

  .progress-track { width: 100%; height: 6px; border-radius: 999px; overflow: hidden; background: var(--purple-100); }
  .progress-fill { height: 100%; border-radius: 999px; background: var(--purple); transition: width 0.5s var(--ease-out); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<header class="max-w-5xl mx-auto px-6 sm:px-10 py-7 flex items-center justify-between">
  <span class="font-display" style="font-weight:700;font-size:1.2rem;">SWEEP</span>
  <span class="text-xs text-ink-faint font-mono">Goldmine Assessment</span>
</header>

<main id="app" class="relative w-full"></main>

<footer class="max-w-5xl mx-auto px-6 sm:px-10 pb-10 text-center">
  <span class="text-xs text-ink-faint font-mono">No customer data is required to complete this assessment.</span>
</footer>

<script>
/* ======================================================================
   ICONS — small inline SVG set, feather/lucide-style line icons
====================================================================== */
function icon(name, size) {
  size = size || 16;
  const common = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;
  const paths = {
    arrowRight: '<line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>',
    chevronLeft: '<polyline points="15 18 9 12 15 6"></polyline>',
    sparkles: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"></path>',
    bot: '<rect x="4" y="9" width="16" height="11" rx="2"></rect><circle cx="9" cy="14.5" r="1"></circle><circle cx="15" cy="14.5" r="1"></circle><path d="M12 9V5"></path><circle cx="12" cy="3.5" r="1.5"></circle>',
    coins: '<circle cx="9" cy="9" r="6"></circle><path d="M14.5 9.5A6 6 0 1 1 9.5 4.5"></path><circle cx="15" cy="15" r="6"></circle>',
    star: '<polygon points="12 2 15.09 8.5 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.5"></polygon>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>',
    share2: '<circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>',
    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>',
    fileSpreadsheet: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M8 13h8M8 17h8M8 13v4"></path>',
    checkCircle2: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 17.01"></polyline>'
  };
  return `<svg ${common}>${paths[name] || ''}</svg>`;
}

/* ======================================================================
   DATA
====================================================================== */
const QUESTIONS = [
  { id: "industry", type: "choice", prompt: "What industry are you in?", options: ["Home Improvements", "Dental", "Estate Agency", "Automotive", "Gym", "Professional Services", "Other"] },
  { id: "enquiries", type: "choice", prompt: "Approximately how many old enquiries are sitting in your CRM?", options: ["<100", "100-500", "500-2,000", "2,000-10,000", "10,000+"] },
  { id: "customers", type: "number", prompt: "Approximately how many previous customers do you have?", placeholder: "e.g. 450" },
  { id: "avgValue", type: "currency", prompt: "What is your average customer value?", placeholder: "e.g. 1200" },
  { id: "lastContacted", type: "choice", prompt: "When were those leads last contacted?", options: ["Less than 3 months", "3-6 months", "6-12 months", "1-2 years", "2+ years", "Never"] },
  { id: "followUp", type: "choice", prompt: "Do you currently follow up automatically?", options: ["Yes", "No", "Sometimes"] },
  { id: "crm", type: "choice", prompt: "What CRM do you use?", options: ["HubSpot", "Salesforce", "Pipedrive", "GoHighLevel", "Excel", "Other"] },
  { id: "salesStaff", type: "choice", prompt: "How many sales staff do you have?", options: ["0", "1-5", "6-20", "20+"] }
];

const REACTIONS = {
  industry: () => "Good to know — that helps calibrate your benchmark.",
  enquiries: (a) => (a === "10,000+" || a === "2,000-10,000" ? "That's a serious pool of untouched opportunity." : "Noted — every enquiry in there is a paid-for lead."),
  customers: () => "Got it. That's your existing relationship base.",
  avgValue: () => "Useful — that's the multiplier behind everything else.",
  lastContacted: (a) => (a === "Never" ? "That's more common than you'd think." : "That's actually quite common."),
  followUp: (a) => (a === "Yes" ? "Good — that puts you ahead of most businesses we see." : a === "Sometimes" ? "Inconsistent follow-up is usually where the leakage starts." : "This usually creates hidden opportunities."),
  crm: () => "Noted.",
  salesStaff: () => "That helps us gauge your follow-up capacity."
};

const ANALYSIS_MESSAGES = [
  "Analysing database potential…",
  "Estimating recoverable revenue…",
  "Calculating Goldmine Score…",
  "Measuring review opportunities…",
  "Predicting referral opportunities…",
  "Assessing follow-up quality…",
  "Generating your personalised report…"
];

const INDUSTRY_BENCHMARK = { "Home Improvements": 61, "Dental": 68, "Estate Agency": 59, "Automotive": 64, "Gym": 57, "Professional Services": 66, "Other": 63 };
const ENQUIRY_MIDPOINT = { "<100": 60, "100-500": 300, "500-2,000": 1250, "2,000-10,000": 6000, "10,000+": 15000 };
const RECENCY_PCT = { "Less than 3 months": 0.02, "3-6 months": 0.04, "6-12 months": 0.06, "1-2 years": 0.05, "2+ years": 0.035, "Never": 0.03 };
const FOLLOWUP_MULT = { "Yes": 0.85, "No": 1.15, "Sometimes": 1.0 };

/* ======================================================================
   SCORING ENGINE — ported unchanged
====================================================================== */
function computeReport(answers) {
  const enquiries = ENQUIRY_MIDPOINT[answers.enquiries] ?? 300;
  const customers = Number(answers.customers) || Math.round(enquiries * 0.4);
  const avgValue = Number(answers.avgValue) || 500;
  const recPct = RECENCY_PCT[answers.lastContacted] ?? 0.04;
  const fMult = FOLLOWUP_MULT[answers.followUp] ?? 1;

  const customerPortion = customers * avgValue * recPct;
  const enquiryPortion = enquiries * avgValue * 0.022;
  const hiddenRevenue = Math.max(4200, Math.round((customerPortion + enquiryPortion) * fMult));

  const reviews = Math.max(6, Math.round(customers * 0.18 * fMult));
  const referrals = Math.max(3, Math.round(customers * 0.045 * fMult));
  const repeatCustomers = Math.max(8, Math.round(customers * 0.22));

  let score = 54;
  if (answers.followUp === "No") score += 18;
  else if (answers.followUp === "Sometimes") score += 9;
  if (["1-2 years", "2+ years"].includes(answers.lastContacted)) score += 13;
  else if (answers.lastContacted === "6-12 months") score += 8;
  else if (answers.lastContacted === "Never") score += 10;
  if (enquiries > 2000) score += 5;
  score = Math.min(96, score);

  const benchmark = INDUSTRY_BENCHMARK[answers.industry] ?? 63;
  const followUpRating = answers.followUp === "Yes" ? "Strong" : answers.followUp === "Sometimes" ? "Inconsistent" : "Needs attention";
  const databaseHealth = score - benchmark >= 15 ? "Above average" : score - benchmark >= -5 ? "Fair" : "Needs attention";
  const roi = Math.min(42, Math.max(7, Math.round(hiddenRevenue / 4200)));

  let headline;
  if (customerPortion > enquiryPortion * 1.15) {
    headline = "Your biggest opportunity isn't new leads. It's the customers you've already paid to acquire.";
  } else if (score - benchmark >= 10) {
    const percentile = Math.min(94, 50 + (score - benchmark) * 2);
    headline = `Your CRM is healthier than ${percentile}% of businesses — but it still has significant untapped potential.`;
  } else {
    headline = `You may be sitting on ${formatCurrency(hiddenRevenue)} of forgotten revenue.`;
  }

  const insights = [
    `Businesses in ${answers.industry || "your industry"} typically lose 20-35% of opportunities to poor follow-up.`,
    answers.followUp === "Yes"
      ? "Your automated follow-up is a real advantage — most of your opportunity now sits in older, colder leads."
      : "Your CRM appears significantly underutilised for a database this size.",
    `Recovering just a small fraction of your dormant enquiries could generate approximately ${formatCurrency(hiddenRevenue)}.`,
    referrals > 15 ? "You appear to have an unusually strong referral opportunity." : "A modest referral programme could meaningfully add to this number."
  ];

  return { hiddenRevenue, reviews, referrals, repeatCustomers, score, benchmark, followUpRating, databaseHealth, roi, headline, insights };
}

function formatCurrency(v) { return "£" + Math.round(v).toLocaleString("en-GB"); }

/* ======================================================================
   SMALL HELPERS — count-up + reveal-on-scroll (vanilla replacements
   for the React useCountUp / useInView hooks)
====================================================================== */
function countUp(el, target, duration) {
  duration = duration || 1600;
  let raf, startTime = null;
  function step(ts) {
    if (startTime === null) startTime = ts;
    const progress = Math.min((ts - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = typeof el._fmt === "function" ? el._fmt(target * eased) : Math.round(target * eased);
    if (progress < 1) raf = requestAnimationFrame(step);
  }
  raf = requestAnimationFrame(step);
}

function revealOnScroll(el, cb) {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) { cb(); obs.disconnect(); }
    });
  }, { threshold: 0.15 });
  obs.observe(el);
}

/* ======================================================================
   APP STATE + STAGE RENDERERS
====================================================================== */
const app = document.getElementById("app");
let state = { stage: "landing", answers: {}, index: 0, report: null };

function render() {
  if (state.stage === "landing") renderLanding();
  else if (state.stage === "quiz") renderQuiz();
  else if (state.stage === "analyzing") renderAnalyzing();
  else if (state.stage === "report") renderReport();
}

function renderLanding() {
  app.innerHTML = `
    <section class="max-w-3xl mx-auto px-6 sm:px-10 pt-24 sm:pt-32 pb-24 text-center">
      <div class="fade-up flex justify-center">
        <div class="eyebrow"><span class="rule"></span>AI Goldmine Assessment</div>
      </div>
      <h1 class="fade-up font-display text-ink" style="font-weight:600;line-height:1.08;font-size:clamp(2.2rem,5.5vw,3.8rem);letter-spacing:-0.02em;animation-delay:0.06s;">
        Discover the hidden revenue sitting inside your CRM
      </h1>
      <p class="fade-up mt-6 max-w-xl mx-auto text-base sm:text-lg text-ink-soft" style="animation-delay:0.14s;">
        Answer a few simple questions and our AI will estimate how much revenue, repeat business,
        reviews and referrals are hiding inside your existing customer database.
      </p>
      <div class="fade-up mt-10 flex flex-col items-center gap-3" style="animation-delay:0.22s;">
        <button id="startBtn" class="primary-btn">Start Free Goldmine Assessment ${icon('arrowRight', 16)}</button>
        <span class="text-xs text-ink-faint font-mono">Takes about 45 seconds &middot; no CRM access needed</span>
      </div>
    </section>`;
  document.getElementById("startBtn").addEventListener("click", () => {
    state.stage = "quiz"; state.index = 0; render();
  });
}

function renderQuiz() {
  const question = QUESTIONS[state.index];
  const total = QUESTIONS.length;
  const pct = ((state.index + 1) / total) * 100;
  const existingVal = state.answers[question.id] ?? "";

  let inputHtml = "";
  if (question.type === "choice") {
    inputHtml = `<div class="grid sm:grid-cols-2 gap-3 mt-8">` +
      question.options.map((opt) => `
        <button class="choice-btn ${existingVal === opt ? 'selected' : ''}" data-opt="${opt.replace(/"/g, '&quot;')}">
          <span>${opt}</span>${existingVal === opt ? icon('checkCircle2', 16) : ''}
        </button>`).join("") +
      `</div>`;
  } else {
    const prefix = question.type === "currency" ? '<span class="text-ink-faint font-mono">£</span>' : "";
    inputHtml = `
      <div class="mt-8">
        <div class="numeric-input-wrap">
          ${prefix}
          <input id="numInput" type="number" inputmode="numeric" placeholder="${question.placeholder}" value="${existingVal}" class="numeric-input">
        </div>
        <div class="mt-6 flex justify-end">
          <button id="continueBtn" class="primary-btn">Continue ${icon('arrowRight', 16)}</button>
        </div>
      </div>`;
  }

  app.innerHTML = `
    <section class="max-w-xl mx-auto px-6 sm:px-10 pb-28">
      <div class="flex items-center justify-between mb-3">
        <button id="backBtn" class="flex items-center gap-1 text-xs font-mono" style="color:${state.index === 0 ? 'transparent' : 'var(--ink-faint)'};cursor:${state.index === 0 ? 'default' : 'pointer'};">
          ${icon('chevronLeft', 13)} Back
        </button>
        <span class="text-xs text-ink-faint font-mono">Question ${state.index + 1} of ${total}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
      <div class="quiz-card fade-up" style="animation-duration:0.45s;">
        <h2 class="font-display text-ink" style="font-weight:600;font-size:clamp(1.3rem,3vw,1.7rem);">${question.prompt}</h2>
        ${inputHtml}
        <div id="reactionSlot"></div>
      </div>
    </section>`;

  document.getElementById("backBtn").addEventListener("click", () => {
    if (state.index === 0) return;
    state.index -= 1; render();
  });

  if (question.type === "choice") {
    app.querySelectorAll(".choice-btn").forEach((btn) => {
      btn.addEventListener("click", () => handleAnswer(question, btn.dataset.opt));
    });
  } else {
    const submit = () => {
      const val = document.getElementById("numInput").value;
      if (val !== "") handleAnswer(question, val);
    };
    document.getElementById("continueBtn").addEventListener("click", submit);
    document.getElementById("numInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  }
}

function handleAnswer(question, val) {
  state.answers[question.id] = val;
  const reactFn = REACTIONS[question.id];
  const text = typeof reactFn === "function" ? reactFn(val) : "Got it.";

  const slot = document.getElementById("reactionSlot");
  slot.innerHTML = `
    <div class="flex items-start gap-2.5 mt-5 fade-up" style="animation-duration:0.4s;">
      <div class="flex items-center justify-center rounded-full flex-shrink-0 bg-purple-100" style="width:26px;height:26px;color:var(--purple);">${icon('bot', 13)}</div>
      <div class="reaction-bubble" id="bubbleContent">
        <span class="typing-dots"><span></span><span></span><span></span></span>
      </div>
    </div>`;

  setTimeout(() => {
    const bubble = document.getElementById("bubbleContent");
    if (bubble) bubble.innerHTML = `<span class="fade-up" style="animation-duration:0.35s;">${text}</span>`;
  }, 550);

  const isLast = state.index === QUESTIONS.length - 1;
  setTimeout(() => {
    if (isLast) {
      state.report = computeReport(state.answers);
      state.stage = "analyzing";
    } else {
      state.index += 1;
    }
    render();
  }, 1150);
}

function renderAnalyzing() {
  app.innerHTML = `
    <section class="max-w-md mx-auto px-6 sm:px-10 pb-28 text-center">
      <div class="rounded-3xl p-12" style="border:1px solid var(--border);background:#fff;box-shadow:0 30px 80px -40px rgba(108,76,241,0.25);">
        <div class="relative mx-auto mb-8" style="width:60px;height:60px;">
          <div class="pulse-ring"></div>
          <div class="pulse-ring pulse-ring-delay"></div>
          <div class="absolute inset-0 flex items-center justify-center text-purple">${icon('sparkles', 22)}</div>
        </div>
        <p id="analyzeMsg" class="fade-up font-display text-ink" style="font-size:1.05rem;animation-duration:0.4s;">${ANALYSIS_MESSAGES[0]}</p>
      </div>
    </section>`;

  let i = 0;
  const interval = setInterval(() => {
    i += 1;
    if (i < ANALYSIS_MESSAGES.length) {
      const el = document.getElementById("analyzeMsg");
      el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
      el.textContent = ANALYSIS_MESSAGES[i];
    } else {
      clearInterval(interval);
      setTimeout(() => { state.stage = "report"; render(); }, 500);
    }
  }, 680);
}

function renderReport() {
  const data = state.report;
  app.innerHTML = `
    <section class="max-w-3xl mx-auto px-6 sm:px-10 pb-28">
      <div id="heroBlock" class="text-center mb-12">
        <div class="fade-up flex justify-center"><div class="eyebrow"><span class="rule"></span>Your goldmine report</div></div>
        <h2 class="fade-up font-display text-ink" style="animation-delay:0.08s;font-weight:600;font-size:clamp(1.7rem,4.2vw,2.5rem);line-height:1.2;max-width:640px;margin:0 auto;">${data.headline}</h2>
        <div class="fade-up mt-8" style="animation-delay:0.18s;">
          <p class="text-xs uppercase tracking-widest mb-2 text-ink-faint font-mono">Estimated hidden revenue</p>
          <div id="revenueCount" class="font-mono text-purple" style="font-weight:700;font-size:clamp(2.4rem,7vw,3.8rem);">£0</div>
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-4 mb-10">
        <div id="scoreCard" class="glass-card p-8">
          <div class="eyebrow"><span class="rule"></span>Goldmine score vs your industry</div>
          <div class="flex items-end gap-6 mt-2">
            <div>
              <div id="scoreCount" class="font-mono" style="font-weight:700;font-size:3rem;color:var(--purple);">0</div>
              <div class="text-xs text-ink-faint font-mono">your score</div>
            </div>
            <div class="pb-2">
              <div id="benchCount" class="font-mono text-ink-soft" style="font-weight:600;font-size:1.4rem;">0</div>
              <div class="text-xs text-ink-faint font-mono">industry average</div>
            </div>
          </div>
          <div class="mt-5 h-2 rounded-full w-full overflow-hidden bg-purple-100">
            <div id="scoreBar" class="h-full rounded-full" style="width:0%;background:linear-gradient(90deg, var(--purple), #9B85F5);transition:width 1.4s var(--ease-out);"></div>
          </div>
        </div>
        <div class="glass-card p-8">
          <div class="eyebrow"><span class="rule"></span>At a glance</div>
          <div class="mt-2">
            <div class="flex items-center justify-between py-3" style="border-bottom:1px solid var(--border);"><span class="text-sm text-ink-soft">Database health</span><span class="font-mono text-ink" style="font-weight:600;">${data.databaseHealth}</span></div>
            <div class="flex items-center justify-between py-3" style="border-bottom:1px solid var(--border);"><span class="text-sm text-ink-soft">Follow-up rating</span><span class="font-mono text-ink" style="font-weight:600;">${data.followUpRating}</span></div>
            <div class="flex items-center justify-between py-3"><span class="text-sm text-ink-soft">Potential ROI</span><span class="font-mono text-ink" style="font-weight:600;">${data.roi}X</span></div>
          </div>
        </div>
      </div>

      <div class="mb-10">
        <div class="text-center mb-6"><div class="eyebrow" style="justify-content:center;"><span class="rule"></span>Four goldmines</div></div>
        <div id="goldminesGrid" class="grid sm:grid-cols-2 gap-4"></div>
      </div>

      <div class="mb-14">
        <div class="text-center mb-6"><div class="eyebrow" style="justify-content:center;"><span class="rule"></span>Personalised insights</div></div>
        <div id="insightsList" class="flex flex-col gap-3"></div>
      </div>

      <div class="glass-card p-10 sm:p-14 text-center" style="background:linear-gradient(160deg, var(--purple-50), #fff);">
        <h3 class="font-display text-ink" style="font-weight:600;font-size:clamp(1.6rem,4vw,2.2rem);">Your Goldmine Is Waiting.</h3>
        <p class="mt-3 max-w-md mx-auto text-sm text-ink-soft">This assessment is based on your answers. To uncover the exact opportunities hidden inside your CRM, book a free Goldmine Review with one of our specialists.</p>
        <div id="ctaSlot" class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
          <a class="primary-btn" href="mailto:david@silverbulletpro.com?subject=Book%20my%20Goldmine%20Review&body=Hi%20David%2C%20I%27d%20like%20to%20book%20my%20free%20Goldmine%20Review.">Book My Goldmine Review ${icon('arrowRight', 16)}</a>
          <button id="uploadToggle" class="secondary-btn">Run Full AI CRM Scan</button>
        </div>
        <div id="uploadSlot" class="mt-8 text-left max-w-md mx-auto" style="display:none;"></div>
      </div>
    </section>`;

  // Hero revenue count-up (runs immediately, it's already in view on report entry)
  const revEl = document.getElementById("revenueCount");
  revEl._fmt = formatCurrency;
  countUp(revEl, data.hiddenRevenue, 2000);

  // Score benchmark count-up + bar, on scroll into view
  const scoreCard = document.getElementById("scoreCard");
  revealOnScroll(scoreCard, () => {
    const scoreEl = document.getElementById("scoreCount");
    const benchEl = document.getElementById("benchCount");
    countUp(scoreEl, data.score, 1500);
    countUp(benchEl, data.benchmark, 1500);
    document.getElementById("scoreBar").style.width = Math.min(100, data.score) + "%";
  });

  // Four goldmines grid, staggered reveal
  const GOLDMINE_META = [
    { key: "revenue", label: "Revenue Goldmine", icon: "coins", value: formatCurrency(data.hiddenRevenue), sub: "estimated recoverable" },
    { key: "reviews", label: "Reviews Goldmine", icon: "star", value: String(data.reviews), sub: "potential new reviews" },
    { key: "referrals", label: "Referral Goldmine", icon: "share2", value: String(data.referrals), sub: "likely referral sources" },
    { key: "repeat", label: "Repeat Customer Goldmine", icon: "users", value: String(data.repeatCustomers), sub: "customers to reactivate" }
  ];
  const grid = document.getElementById("goldminesGrid");
  grid.innerHTML = GOLDMINE_META.map((g, i) => `
    <div class="glass-card p-6" style="opacity:0;" data-delay="${i * 0.09}">
      <div class="flex items-center justify-center rounded-xl mb-4 bg-purple-100 text-purple" style="width:38px;height:38px;">${icon(g.icon, 17)}</div>
      <div class="font-mono text-ink" style="font-weight:700;font-size:1.6rem;">${g.value}</div>
      <div class="text-xs mt-1 text-ink-faint">${g.sub}</div>
      <div class="text-sm mt-3 text-ink-soft">${g.label}</div>
    </div>`).join("");
  revealOnScroll(grid, () => {
    grid.querySelectorAll("[data-delay]").forEach((el) => {
      el.style.animationDelay = el.dataset.delay + "s";
      el.classList.add("fade-up");
      el.style.opacity = "";
    });
  });

  // Insights list, staggered reveal
  const insightsList = document.getElementById("insightsList");
  insightsList.innerHTML = data.insights.map((text, i) => `
    <div class="insight-row" style="opacity:0;" data-delay="${i * 0.08}">${icon('sparkles', 15)}<span>${text}</span></div>`).join("");
  revealOnScroll(insightsList, () => {
    insightsList.querySelectorAll("[data-delay]").forEach((el) => {
      el.style.animationDelay = el.dataset.delay + "s";
      el.classList.add("fade-up");
      el.style.opacity = "";
    });
  });

  // CRM upload toggle + drag/drop panel
  document.getElementById("uploadToggle").addEventListener("click", () => {
    const slot = document.getElementById("uploadSlot");
    const showing = slot.style.display !== "none";
    if (showing) { slot.style.display = "none"; return; }
    slot.style.display = "block";
    slot.innerHTML = `
      <div id="uploadZone" class="upload-zone">
        <input id="fileInput" type="file" accept=".csv,.xls,.xlsx" class="hidden">
        <div class="mx-auto mb-4 flex items-center justify-center rounded-full bg-purple-100 text-purple" style="width:50px;height:50px;">${icon('upload', 20)}</div>
        <p class="text-ink">Drag your CRM export here, or <span class="text-purple">browse files</span></p>
        <p class="text-xs mt-2 text-ink-faint font-mono">${icon('fileSpreadsheet', 11)} CSV &middot; Excel &middot; HubSpot &middot; Salesforce &middot; Pipedrive</p>
      </div>`;
    const zone = document.getElementById("uploadZone");
    const input = document.getElementById("fileInput");
    const received = () => {
      zone.outerHTML = `
        <div class="glass-card p-8 text-center">
          <div class="text-purple mb-3" style="display:flex;justify-content:center;">${icon('checkCircle2', 22)}</div>
          <p class="font-display text-ink" style="font-size:1.05rem;">Received.</p>
          <p class="text-sm mt-2 text-ink-soft">We'll process your CRM securely and send your full breakdown within one business day.</p>
        </div>`;
    };
    zone.addEventListener("click", () => input.click());
    zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag"));
    zone.addEventListener("drop", (e) => { e.preventDefault(); zone.classList.remove("drag"); received(); });
    input.addEventListener("change", () => { if (input.files && input.files[0]) received(); });
  });
}

render();
</script>
</body>
</html>
