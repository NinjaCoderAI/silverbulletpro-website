<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Started with SWEEP Recover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --white: #ffffff;
  --bg: #f9f9fc;
  --lavender: #f3f0ff;
  --ink: #1a1a2e;
  --ink-soft: #4a4a6a;
  --ink-mid: #7a7a9a;
  --rule: #e8e8f0;
  --coral: #f97066;
  --coral-h: #f75a4e;
  --r: 14px;
  --shadow-md: 0 8px 32px rgba(26,26,46,0.12);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 60px 20px 80px; }
.logo { font-weight: 800; font-size: 1.4rem; text-decoration: none; color: var(--ink); }
.logo span { color: var(--coral); }
h1 { font-size: 2rem; font-weight: 800; margin: 32px 0 8px; line-height: 1.2; }
.sub { color: var(--ink-soft); margin: 0 0 32px; font-size: 1.05rem; }
form {
  background: var(--white);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  padding: 28px;
  box-shadow: var(--shadow-md);
}
label { display: block; font-weight: 600; font-size: 0.9rem; margin: 18px 0 6px; }
label:first-of-type { margin-top: 0; }
.hint { font-weight: 400; color: var(--ink-mid); font-size: 0.82rem; }
input, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.95rem;
  color: var(--ink);
  background: var(--bg);
}
input:focus, textarea:focus { outline: none; border-color: var(--coral); background: var(--white); }
textarea { resize: vertical; min-height: 70px; }
button {
  width: 100%;
  margin-top: 26px;
  padding: 15px;
  border: none;
  border-radius: var(--r);
  background: var(--coral);
  color: var(--white);
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
}
button:hover { background: var(--coral-h); }
button:disabled { opacity: 0.6; cursor: not-allowed; }
#msg { margin-top: 14px; font-size: 0.9rem; display: none; }
#msg.error { color: var(--coral-h); }
.note { margin-top: 20px; color: var(--ink-mid); font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="logo">SweepDBM<span>.</span></a>
  <h1>Get started with Recover</h1>
  <p class="sub">Tell us about your business, then set up billing. Your dedicated number and account get created automatically the moment payment goes through.</p>

  <form id="signup-form">
    <label for="business_name">Business name</label>
    <input type="text" id="business_name" name="business_name" required>

    <label for="owner_name">Your name</label>
    <input type="text" id="owner_name" name="owner_name" required>

    <label for="owner_email">Email</label>
    <input type="email" id="owner_email" name="owner_email" required>

    <label for="whatsapp_recipient">WhatsApp number for hot-lead alerts <span class="hint">(e.g. +447700900000)</span></label>
    <input type="tel" id="whatsapp_recipient" name="whatsapp_recipient" required>

    <label for="service_name">What are you following up on? <span class="hint">(optional, e.g. "kitchen quotes")</span></label>
    <input type="text" id="service_name" name="service_name">

    <label for="business_description">A line about your business <span class="hint">(optional, helps personalise replies)</span></label>
    <textarea id="business_description" name="business_description"></textarea>

    <button type="submit" id="submit-btn">Continue to payment</button>
    <div id="msg"></div>
  </form>

  <p class="note">No sales call needed. Have a question first? <a href="mailto:david@silverbulletpro.com">Email us</a> instead.</p>
</div>

<script>
document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('msg');
  msg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Setting up...';

  const payload = {
    business_name: document.getElementById('business_name').value.trim(),
    owner_name: document.getElementById('owner_name').value.trim(),
    owner_email: document.getElementById('owner_email').value.trim(),
    whatsapp_recipient: document.getElementById('whatsapp_recipient').value.trim(),
    service_name: document.getElementById('service_name').value.trim(),
    business_description: document.getElementById('business_description').value.trim()
  };

  try {
    const res = await fetch('https://silver-bullet-ai-production.up.railway.app/api/onboarding/start-recover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Something went wrong. Please try again.');
    }

    window.location.href = data.checkoutUrl;

  } catch (err) {
    msg.className = 'error';
    msg.textContent = err.message;
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Continue to payment';
  }
});
</script>
</body>
</html>
